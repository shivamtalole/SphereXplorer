<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SphereXplorer — Three.js Spiral Galaxy Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #04060d;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f1f5f9;
    }
    canvas.webgl {
      position: fixed;
      top: 0;
      left: 0;
      outline: none;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      background: rgba(12, 19, 38, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 16px 20px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .hud h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .hud p {
      font-size: 12px;
      color: #94a3b8;
      font-family: monospace;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">
    <h1>SphereXplorer Three.js Galaxy</h1>
    <p>THREE.Points & BufferGeometry Procedural Particle Simulation</p>
  </div>

  <canvas class="webgl"></canvas>

  <script>
    // Canvas & Scene
    const canvas = document.querySelector('canvas.webgl');
    const scene = new THREE.Scene();

    // Parameters
    const parameters = {
      count: 75000,
      size: 0.018,
      radius: 6.5,
      branches: 4,
      spin: 1.2,
      randomness: 0.45,
      power: 3.2,
      insideColor: '#06b6d4',
      outsideColor: '#a855f7'
    };

    let geometry = null;
    let material = null;
    let points = null;

    function generateGalaxy() {
      // EXACT USER CODE:
      if (points !== null) {
        geometry.dispose();
        material.dispose();
        scene.remove(points);
      }

      // Geometry & Positions
      geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(parameters.count * 3);
      const colors = new Float32Array(parameters.count * 3);

      const colorInside = new THREE.Color(parameters.insideColor);
      const colorOutside = new THREE.Color(parameters.outsideColor);

      for (let i = 0; i < parameters.count; i++) {
        const i3 = i * 3;
        const radius = Math.random() * parameters.radius;
        const spinAngle = radius * parameters.spin;
        const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;

        const randomX = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
        const randomY = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
        const randomZ = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

        positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
        positions[i3 + 1] = randomY;
        positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

        const mixedColor = colorInside.clone();
        mixedColor.lerp(colorOutside, radius / parameters.radius);

        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // EXACT USER CODE:
      material = new THREE.PointsMaterial({
        size: parameters.size,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true
      });

      points = new THREE.Points(geometry, material);
      scene.add(points);
    }

    generateGalaxy();

    // Viewport Sizes
    const sizes = {
      width: window.innerWidth,
      height: window.innerHeight
    };

    window.addEventListener('resize', () => {
      sizes.width = window.innerWidth;
      sizes.height = window.innerHeight;

      camera.aspect = sizes.width / sizes.height;
      camera.updateProjectionMatrix();

      renderer.setSize(sizes.width, sizes.height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // Camera
    const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
    camera.position.set(3, 3, 5);
    camera.lookAt(0, 0, 0);
    scene.add(camera);

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      alpha: true,
      antialias: true
    });
    renderer.setSize(sizes.width, sizes.height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Mouse Interaction
    const mouse = { x: 0, y: 0 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / sizes.width - 0.5) * 0.8;
      mouse.y = (e.clientY / sizes.height - 0.5) * 0.8;
    });

    // Animation Loop
    const clock = new THREE.Clock();

    function tick() {
      const elapsedTime = clock.getElapsedTime();

      if (points) {
        points.rotation.y = elapsedTime * 0.05 + mouse.x * 0.5;
        points.rotation.x = 0.3 + mouse.y * 0.3;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
